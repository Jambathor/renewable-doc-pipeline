name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -V
      - run: pip install ruff==0.1.9 black==23.11.0
      - run: black --version && ruff --version
      - run: echo "CI bootstrap OK"