[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-doc-pipeline"
version = "1.0.0"
description = "Renewable Energy PDF Processing Pipeline API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "pydantic>=2.5,<3",
    "uvicorn>=0.24.0,<0.25.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
exclude = ["migrations", ".venv", "venv"]

[tool.ruff.per-file-ignores]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "llama_index.*",
    "qdrant_client.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''